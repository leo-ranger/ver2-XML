name: Update EPG XML Fuel tv

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create directory structure
        run: mkdir -p download_EPG/individual/Sports
      - name: Fetch EPG XML (today + tomorrow)
        run: |
          TODAY=$(date -u +%Y%m%d)
          TOMORROW=$(date -u -d "+1 day" +%Y%m%d)

          curl -L -o today.xml \
          "https://epg.pw/api/epg.xml?lang=en&date=${TODAY}&channel_id=421685"

          curl -L -o tomorrow.xml \
          "https://epg.pw/api/epg.xml?lang=en&date=${TOMORROW}&channel_id=421685"

      - name: Build 24h shifted EPG (08:00 → 00:00 roll)
        run: |
          python3 << 'EOF'
          import re
          from datetime import datetime, timedelta

          SHIFT = 8

          def parse(file):
              with open(file, "r", encoding="utf-8") as f:
                  return f.read()

          today = parse("today.xml")
          tomorrow = parse("tomorrow.xml")

          pattern = re.compile(r'(start|stop)="(\d{14})\s([+-]\d{4})"')

          def shift(ts, hours):
              dt = datetime.strptime(ts, "%Y%m%d%H%M%S")
              dt += timedelta(hours=hours)
              return dt.strftime("%Y%m%d%H%M%S")

          # Split logic:
          # - today: shift -8h (so 08:00 becomes 00:00)
          # - tomorrow: only take 00:00–08:00, shift -8h to fill end

          def transform(xml, shift_hours):
              def repl(m):
                  tag, ts, tz = m.group(1), m.group(2), m.group(3)
                  return f'{tag}="{shift(ts, shift_hours)} {tz}"'
              return pattern.sub(repl, xml)

          today_shifted = transform(today, -SHIFT)
          tomorrow_shifted = transform(tomorrow, -SHIFT)

          # Keep only tomorrow entries that belong to first 8 hours AFTER shift logic
          def filter_tomorrow(xml):
              out = []
              for line in xml.splitlines():
                  if 'start="' in line:
                      ts = re.search(r'start="(\d{14})', line)
                      if ts:
                          t = datetime.strptime(ts.group(1), "%Y%m%d%H%M%S")
                          if t.hour < SHIFT:
                              out.append(line)
                  else:
                      out.append(line)
              return "\n".join(out)

          tomorrow_filtered = filter_tomorrow(tomorrow_shifted)

          merged = today_shifted.replace("</tv>", "") + "\n" + tomorrow_filtered + "\n</tv>"

          with open("download_EPG/individual/Sports/fueltv.xml", "w", encoding="utf-8") as f:
              f.write(merged)
          EOF

      - name: Ensure XML header + DOCTYPE
        run: |
          FILE=download_EPG/individual/Sports/fueltv.xml

          if ! head -n 1 "$FILE" | grep -q "<?xml"; then
            sed -i '1i<?xml version="1.0" encoding="UTF-8"?>' "$FILE"
          fi

          sed -i '/^<\?xml/ a <!DOCTYPE tv SYSTEM "xmltv.dtd">' "$FILE"

      - name: Inject show metadata (shared definitions)
        run: bash .github/scripts/inject_epg.sh download_EPG/individual/Sports/fueltv.xml

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add download_EPG/individual/Sports/fueltv.xml

          git commit -m "Updated EPG $(date -u +%Y-%m-%d)" || exit 0
          git pull --rebase
          git push
