name: Update EPG XML Fuel tv

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create directory structure
        run: mkdir -p download_EPG/individual/Sports

      # -----------------------------
      # FETCH EPG
      # -----------------------------
      - name: Fetch EPG XML (today + tomorrow)
        run: |
          TODAY=$(date -u +%Y%m%d)
          TOMORROW=$(date -u -d "+1 day" +%Y%m%d)

          curl -L -o today.xml \
          "https://epg.pw/api/epg.xml?lang=en&date=${TODAY}&channel_id=421685"

          curl -L -o tomorrow.xml \
          "https://epg.pw/api/epg.xml?lang=en&date=${TOMORROW}&channel_id=421685"

      # -----------------------------
      # BUILD SHIFTED 24H EPG
      # -----------------------------
      - name: Build 24h shifted EPG (08:00 → 00:00 roll)
        run: |
          python3 << 'EOF'
          import re
          from datetime import datetime, timedelta

          SHIFT = 8
          FILE = "download_EPG/individual/Sports/fueltv.xml"

          def load(f):
              with open(f, "r", encoding="utf-8") as x:
                  return x.read()

          today_xml = load("today.xml")
          tomorrow_xml = load("tomorrow.xml")

          programme_re = re.compile(r'<programme.*?</programme>', re.S)
          time_re = re.compile(r'(start|stop)="(\d{14})\s([+-]\d{4})"')

          def shift_time(ts, h):
              dt = datetime.strptime(ts, "%Y%m%d%H%M%S")
              dt += timedelta(hours=h)
              return dt.strftime("%Y%m%d%H%M%S")

          def shift_block(block, h):
              return time_re.sub(
                  lambda m: f'{m.group(1)}="{shift_time(m.group(2), h)} {m.group(3)}"',
                  block
              )

          today_programmes = programme_re.findall(today_xml)
          tomorrow_programmes = programme_re.findall(tomorrow_xml)

          today_shifted = [shift_block(p, -SHIFT) for p in today_programmes]

          tomorrow_shifted = []
          for p in tomorrow_programmes:
              shifted = shift_block(p, -SHIFT)
              m = re.search(r'start="(\d{14})', shifted)

              if m:
                  t = datetime.strptime(m.group(1), "%Y%m%d%H%M%S")
                  if t.hour < SHIFT:
                      tomorrow_shifted.append(shifted)

          header = re.search(r'<\?xml.*?\?>', today_xml)
          tv_open = re.search(r'<tv[^>]*>', today_xml)

          output = []
          if header:
              output.append(header.group())
          if tv_open:
              output.append(tv_open.group())

          output += today_shifted
          output += tomorrow_shifted
          output.append("</tv>")

          with open(FILE, "w", encoding="utf-8") as f:
              f.write("\n".join(output))
          EOF

      # -----------------------------
      # MATCH + ENRICH + FORMAT (CORE LOGIC)
      # -----------------------------
      - name: Match + Enrich + Format EPG
        run: |
          python3 << 'EOF'
          import re
          import requests
          from difflib import SequenceMatcher
          from datetime import datetime

          FILE = "download_EPG/individual/Sports/fueltv.xml"

          TODAY = datetime.utcnow().strftime("%Y-%m-%d")
          URL = f"https://fuel.tv/browse/guide/{TODAY}"

          def sim(a, b):
              return SequenceMatcher(None, a.lower(), b.lower()).ratio()

          try:
              html = requests.get(URL, timeout=30).text
          except:
              html = ""

          blocks = re.findall(r'<div[^>]*>(.*?)</div>', html, re.S)

          guide = []
          for b in blocks:
              t = re.sub(r'<.*?>', '', b).strip()
              if len(t) > 10:
                  guide.append(t)

          programme_re = re.compile(r'<programme.*?</programme>', re.S)

          def get_raw(block):
              m = re.search(r'<title>(.*?)</title>', block)
              return m.group(1) if m else ""

          def parse(raw):
              m = re.match(r"^(.*?)\s*[–-]\s*Sn\s*(\d+),\s*Ep\s*(\d+)\.\s*(.*)$", raw)
              if not m:
                  return None

              return {
                  "show": m.group(1).strip(),
                  "season": int(m.group(2)),
                  "episode": int(m.group(3)),
                  "ep_title": m.group(4).strip()
              }

          def build_ep(season, episode):
              return f"S{season}.E{episode}.", f"{season-1}.{episode-1}.0"

          def inject_desc(block, desc):
              if not desc:
                  return block

              if "<desc>" in block:
                  block = re.sub(r'<desc>.*?</desc>', f'<desc>{desc}</desc>', block)
              else:
                  block = block.replace("</programme>", f"<desc>{desc}</desc></programme>")
              return block

          def inject_format(block, parsed):
              if not parsed:
                  return block

              onscreen, xmltv_ns = build_ep(parsed["season"], parsed["episode"])

              block = re.sub(r'<title>.*?</title>', f'<title>{parsed["show"]}</title>', block)

              if "<sub-title>" in block:
                  block = re.sub(r'<sub-title>.*?</sub-title>', f'<sub-title>{parsed["ep_title"]}</sub-title>', block)
              else:
                  block = block.replace("</programme>", f"<sub-title>{parsed['ep_title']}</sub-title></programme>")

              block = re.sub(r'<episode-num.*?</episode-num>', '', block)

              ep_xml = (
                  f'<episode-num system="onscreen">{onscreen}</episode-num>'
                  f'<episode-num system="xmltv_ns">{xmltv_ns}</episode-num>'
              )

              return block.replace("</programme>", ep_xml + "</programme>")

          with open(FILE, "r", encoding="utf-8") as f:
              xml = f.read()

          programmes = programme_re.findall(xml)
          output = []

          for p in programmes:
              raw = get_raw(p)

              # -------------------------
              # MATCH FIRST (RAW TITLE)
              # -------------------------
              best = 0
              best_desc = None

              for g in guide:
                  score = sim(raw, g)
                  if score > best:
                      best = score
                      best_desc = g

              if best >= 0.80:
                  p = inject_desc(p, best_desc)

              parsed = parse(raw)
              p = inject_format(p, parsed)

              output.append(p)

          header = re.search(r'<\?xml.*?\?>', xml)
          tv_open = re.search(r'<tv[^>]*>', xml)

          final = []
          if header:
              final.append(header.group())
          if tv_open:
              final.append(tv_open.group())

          final += output
          final.append("</tv>")

          with open(FILE, "w", encoding="utf-8") as f:
              f.write("\n".join(final))
          EOF

      # -----------------------------
      # FINAL XML CLEANUP
      # -----------------------------
      - name: Ensure XML header + DOCTYPE
        run: |
          FILE=download_EPG/individual/Sports/fueltv.xml

          if ! head -n 1 "$FILE" | grep -q "<?xml"; then
            sed -i '1i<?xml version="1.0" encoding="UTF-8"?>' "$FILE"
          fi

          sed -i '/^<\?xml/ a <!DOCTYPE tv SYSTEM "xmltv.dtd">' "$FILE"

      # -----------------------------
      # COMMIT
      # -----------------------------
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add download_EPG/individual/Sports/fueltv.xml

          git commit -m "Updated EPG $(date -u +%Y-%m-%d)" || exit 0
          git pull --rebase
          git push
