name: Update EPG XML Clubbing TV

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create directory structure
        run: mkdir -p download_EPG/individual/ClubbingTV

      # -----------------------------
      # FETCH EPG
      # -----------------------------
      - name: Fetch EPG XML (today + tomorrow)
        run: |
          TODAY=$(date -u +%Y%m%d)
          TOMORROW=$(date -u -d "+1 day" +%Y%m%d)

          curl -L -o today.xml \
          "https://epg.pw/api/epg.xml?lang=en&date=${TODAY}&channel_id=5771"

          curl -L -o tomorrow.xml \
          "https://epg.pw/api/epg.xml?lang=en&date=${TOMORROW}&channel_id=5771"

      # -----------------------------
      # SHIFT EPG (ONLY)
      # -----------------------------
      - name: Shift EPG (12 hour shift)
        run: |
          python3 << 'EOF'
          import re
          from datetime import datetime, timedelta

          SHIFT = 8
          FILE = "download_EPG/individual/ClubbingTV/clubbingtv.xml"

          def load(f):
              with open(f, "r", encoding="utf-8") as x:
                  return x.read()

          xml = load("today.xml") + load("tomorrow.xml")

          def shift_ts(match):
              tag = match.group(1)
              ts = match.group(2)
              tz = match.group(3)

              dt = datetime.strptime(ts, "%Y%m%d%H%M%S")
              dt -= timedelta(hours=SHIFT)

              return f'{tag}="{dt.strftime("%Y%m%d%H%M%S")} {tz}"'

          xml = re.sub(
              r'(start|stop)="(\d{14})\s([+-]\d{4})"',
              shift_ts,
              xml
          )

          with open(FILE, "w", encoding="utf-8") as f:
              f.write(xml)
          EOF

      # -----------------------------
      # TRANSLATE ONLY (RU → EN)
      # -----------------------------
      - name: Translate Russian → English
        run: |
          pip install deep-translator

          python3 << 'EOF'
          import re
          from deep_translator import GoogleTranslator

          FILE = "download_EPG/individual/ClubbingTV/clubbingtv.xml"
          translator = GoogleTranslator(source='ru', target='en')

          def is_ru(text):
              return bool(re.search(r'[\u0400-\u04FF]', text))

          def tr(text):
              if not text:
                  return text
              if is_ru(text):
                  try:
                      return translator.translate(text)
                  except:
                      return text
              return text

          with open(FILE, "r", encoding="utf-8") as f:
              xml = f.read()

          xml = re.sub(
              r'(<title[^>]*>)(.*?)(</title>)',
              lambda m: m.group(1) + tr(m.group(2)) + m.group(3),
              xml
          )

          xml = re.sub(
              r'(<sub-title>)(.*?)(</sub-title>)',
              lambda m: m.group(1) + tr(m.group(2)) + m.group(3),
              xml
          )

          xml = re.sub(
              r'(<desc>)(.*?)(</desc>)',
              lambda m: m.group(1) + tr(m.group(2)) + m.group(3),
              xml
          )

          with open(FILE, "w", encoding="utf-8") as f:
              f.write(xml)
          EOF

      # -----------------------------
      # CLEANUP
      # -----------------------------
      - name: Ensure XML header
        run: |
          FILE=download_EPG/individual/ClubbingTV/clubbingtv.xml

          if ! head -n 1 "$FILE" | grep -q "<?xml"; then
            sed -i '1i<?xml version="1.0" encoding="UTF-8"?>' "$FILE"
          fi

      # -----------------------------
      # COMMIT
      # -----------------------------
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add download_EPG/individual/ClubbingTV/clubbingtv.xml

          git commit -m "Updated ClubbingTV EPG $(date -u +%Y-%m-%d)" || exit 0
          git pull --rebase
          git push
