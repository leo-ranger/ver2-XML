name: Update EPG XML ClubbingTV

on:
  schedule:
    - cron: '0 0 * * *'  # Runs at midnight UTC daily
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create folder ClubbingTV
        run: mkdir -p download_EPG/individual/ClubbingTV

      # -----------------------------
      # FETCH TODAY + TOMORROW
      # -----------------------------
      - name: Fetch EPG XML (today + tomorrow)
        run: |
          TODAY=$(date -u +%Y%m%d)
          TOMORROW=$(date -u -d "+1 day" +%Y%m%d)

          curl -o today.xml \
          "https://epg.pw/api/epg.xml?lang=en&date=${TODAY}&channel_id=5771"

          curl -o tomorrow.xml \
          "https://epg.pw/api/epg.xml?lang=en&date=${TOMORROW}&channel_id=5771"

      # -----------------------------
      # APPLY FIXED OFFSET (-13 HOURS)
      # -----------------------------
      - name: Apply EPG time correction (-13h)
        run: |
          python3 << 'EOF'
          import re
          from datetime import datetime, timedelta

          FILE_OUT = "download_EPG/individual/ClubbingTV/ClubbingTV.xml"

          OFFSET_HOURS = -13

          with open("today.xml", "r", encoding="utf-8") as f:
              today = f.read()

          with open("tomorrow.xml", "r", encoding="utf-8") as f:
              tomorrow = f.read()

          pattern = re.compile(r'(start|stop)="(\d{14})\s([+-]\d{4})"')

          def shift(ts):
              dt = datetime.strptime(ts, "%Y%m%d%H%M%S")
              dt += timedelta(hours=OFFSET_HOURS)
              return dt.strftime("%Y%m%d%H%M%S")

          def transform(xml):
              return pattern.sub(
                  lambda m: f'{m.group(1)}="{shift(m.group(2))} {m.group(3)}"',
                  xml
              )

          today_shifted = transform(today)
          tomorrow_shifted = transform(tomorrow)

          insert_pos = today_shifted.rfind("</tv>")

          merged = (
              today_shifted[:insert_pos] +
              "\n" + tomorrow_shifted +
              "\n</tv>"
          )

          with open(FILE_OUT, "w", encoding="utf-8") as f:
              f.write(merged)
          EOF

      # -----------------------------
      # XML HEADER
      # -----------------------------
      - name: Add XML Declaration and DOCTYPE
        run: |
          sed -i '1s|$| <!DOCTYPE tv SYSTEM "xmltv.dtd">|' download_EPG/individual/ClubbingTV/ClubbingTV.xml

      # -----------------------------
      # TRANSLATION STEP
      # -----------------------------
      - name: Translate Russian titles and descriptions
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install googletrans==4.0.0-rc1
          python3 - << 'EOF'
          import xml.etree.ElementTree as ET
          from googletrans import Translator
          import re

          xml_file = "download_EPG/individual/ClubbingTV/ClubbingTV.xml"
          tree = ET.parse(xml_file)
          root = tree.getroot()
          translator = Translator()

          def fix_spacing(text):
              return re.sub(r'([.!?])([A-Za-z])', r'\1 \2', text)

          for prog in root.findall('programme'):
              for title in prog.findall('title'):
                  if title.text and title.text.strip():
                      try:
                          title.text = translator.translate(title.text, src='ru', dest='en').text
                      except Exception:
                          pass

              desc = prog.find('desc')
              if desc is not None and desc.text and desc.text.strip():
                  try:
                      desc.text = translator.translate(desc.text, src='ru', dest='en').text
                  except Exception:
                      pass

          tree.write(xml_file, encoding='utf-8', xml_declaration=True)
          EOF

      # -----------------------------
      # ICON INJECTION
      # -----------------------------
      - name: Inject default icon after <desc>
        run: |
          python3 - << 'EOF'
          import xml.etree.ElementTree as ET

          xml_file = "download_EPG/individual/ClubbingTV/ClubbingTV.xml"
          tree = ET.parse(xml_file)
          root = tree.getroot()

          icon_url = "https://i0.wp.com/www.decodedmagazine.com/wp-content/uploads/2018/12/clubbintv-700x450.jpg?resize=700%2C450&ssl=1"

          for prog in root.findall('programme'):
              if prog.find('icon') is None:
                  desc = prog.find('desc')
                  icon_elem = ET.Element('icon')
                  icon_elem.set('src', icon_url)
                  if desc is not None:
                      prog.insert(list(prog).index(desc) + 1, icon_elem)
                  else:
                      prog.append(icon_elem)

          tree.write(xml_file, encoding='utf-8', xml_declaration=True)
          EOF

      # -----------------------------
      # COMMIT CHANGES
      # -----------------------------
      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git pull --rebase --autostash
          git add download_EPG/individual/ClubbingTV/ClubbingTV.xml
          git commit -m "Updated ClubbingTV EPG $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push
